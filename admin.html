const FIELD_TYPES = [["text", "Short text"], ["textarea", "Long text"], ["number", "Number"], ["select", "Dropdown (choose one)"]];
function newFieldId() { return "f" + Math.random().toString(36).slice(2, 8); }
function productForm(p = {}) {
  let fields = JSON.parse(JSON.stringify(p.fields && p.fields.length ? p.fields
    : p.id ? [] : [{ id: newFieldId(), label: "Telegram username", type: "text", required: true, placeholder: "@username" }]));
  openModal(`<h2>${p.id ? "Edit" : "Add"} product</h2><form id="pf">
    <label>Photo</label>
    <div class="row"><img id="prev" class="thumb ${p.image_url ? "" : "hidden"}" src="${esc(p.image_url || "")}" style="width:72px;height:72px">
    <input type="file" name="file" accept="image/*"></div>
    <label>Product name</label><input name="pname" required maxlength="100" value="${esc(p.name || "")}" placeholder="e.g. Telegram Stars">
    <div class="grid-2"><div><label>Price per 1 (${CFG.CURRENCY})</label><input type="number" name="price" min="0" step="0.01" required value="${p.price ?? ""}"></div>
    <div><label>Display order (lower = first)</label><input type="number" name="sort" value="${p.sort ?? 0}"></div>
    <div><label>Minimum quantity</label><input type="number" name="min_qty" min="1" value="${p.min_qty ?? 1}"></div>
    <div><label>Maximum quantity</label><input type="number" name="max_qty" min="1" value="${p.max_qty ?? 1000}"></div></div>
    <label>Description</label><textarea name="description" maxlength="3000">${esc(p.description || "")}</textarea>
    <div class="setting-row"><b>Visible to customers</b><label class="switch" style="margin:0"><input type="checkbox" name="active" ${p.active !== false ? "checked" : ""}><span></span></label></div>
    <div class="setting-row"><div><b>Out of stock</b><div class="small muted">Shown to customers but they can't buy it</div></div><label class="switch" style="margin:0"><input type="checkbox" name="oos" ${p.out_of_stock ? "checked" : ""}><span></span></label></div>
    <label>Daily limit <span class="muted">(optional — most units sold per day, all customers together)</span></label>
    <input type="number" name="daily_limit" min="0" step="1" value="${p.daily_limit ?? ""}" placeholder="No limit">

    <h3 class="mt">⚡ Flash sale <span class="muted small">(optional)</span></h3>
    <p class="small muted">Customers see the old price crossed out and a countdown. Leave the sale price empty for no sale.</p>
    <div class="grid-2"><div><label>Sale price (${CFG.CURRENCY})</label><input type="number" name="sale_price" min="0" step="0.01" value="${p.sale_price ?? ""}"></div>
      <div><label>Starts <span class="muted">(empty = now)</span></label><input type="datetime-local" name="sale_starts_at" value="${toLocalInput(p.sale_starts_at)}"></div></div>
    <label>Ends <span class="muted">(shows a countdown)</span></label><input type="datetime-local" name="sale_ends_at" value="${toLocalInput(p.sale_ends_at)}">

    <h3 class="mt">Order form for this product</h3>
    <p class="small muted">Customers fill this in when they buy (quantity is always asked). Add, edit, reorder or remove fields.</p>
    <div id="fields"></div>
    <button type="button" class="btn soft block mt" id="addField">${ICONS.plus} Add field</button>
    <button class="btn block mt">Save product</button></form>`, (m) => {
    const f = $("#pf", m);
    const box = $("#fields", m);
    const draw = () => {
      box.innerHTML = fields.length ? fields.map((fd, i) => `<div class="field-row" data-i="${i}">
        <div class="row"><input class="grow" data-k="label" value="${esc(fd.label)}" placeholder="Field name, e.g. Telegram username" required>
          <select data-k="type" style="width:auto">${FIELD_TYPES.map(([k, l]) => `<option value="${k}" ${fd.type === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="row mt">
          ${fd.type === "select" ? `<input class="grow" data-k="options" value="${esc((fd.options || []).join(", "))}" placeholder="Options, separated by commas">`
            : `<input class="grow" data-k="placeholder" value="${esc(fd.placeholder || "")}" placeholder="Hint shown inside the box (optional)">`}
          <label class="row small" style="margin:0;white-space:nowrap;color:var(--text)"><input type="checkbox" data-k="required" ${fd.required ? "checked" : ""} style="width:auto"> Required</label>
        </div>
        <div class="row mt" style="justify-content:flex-end">
          <button type="button" class="btn sm soft" data-mv="-1" ${i === 0 ? "disabled" : ""}>↑</button>
          <button type="button" class="btn sm soft" data-mv="1" ${i === fields.length - 1 ? "disabled" : ""}>↓</button>
          <button type="button" class="btn sm danger" data-rm>Remove</button></div>
      </div>`).join("") : `<p class="small muted">No extra fields — customers only choose a quantity.</p>`;
    };
    const sync = () => $$(".field-row", box).forEach((row) => {
      const fd = fields[row.dataset.i];
      fd.label = $('[data-k="label"]', row).value.trim();
      fd.type = $('[data-k="type"]', row).value;
      fd.required = $('[data-k="required"]', row).checked;
      const o = $('[data-k="options"]', row), ph = $('[data-k="placeholder"]', row);
      if (o) fd.options = o.value.split(",").map((x) => x.trim()).filter(Boolean);
      if (ph) fd.placeholder = ph.value.trim();
    });
    box.onchange = (e) => { if (e.target.dataset.k === "type") { sync(); draw(); } };
    box.onclick = (e) => {
      const row = e.target.closest(".field-row"); if (!row) return;
      const i = Number(row.dataset.i);
      if (e.target.dataset.mv) { sync(); const j = i + Number(e.target.dataset.mv); [fields[i], fields[j]] = [fields[j], fields[i]]; draw(); }
      if (e.target.hasAttribute("data-rm")) { sync(); fields.splice(i, 1); draw(); }
    };
    $("#addField", m).onclick = () => { sync(); fields.push({ id: newFieldId(), label: "", type: "text", required: true }); draw(); $$('[data-k="label"]', box).pop()?.focus(); };
    draw();
    f.file.onchange = () => { const file = f.file.files[0]; if (file) { $("#prev", m).src = URL.createObjectURL(file); $("#prev", m).classList.remove("hidden"); } };
    f.onsubmit = (e) => {
      e.preventDefault();
      sync();
      for (const fd of fields) {
        if (!fd.label) return toast("Every form field needs a name.", "error");
        if (fd.type === "select" && !(fd.options || []).length) return toast(`Add options for "${fd.label}".`, "error");
        if (fd.type !== "select") delete fd.options;
      }
      const minq = Math.max(1, Math.floor(Number(f.min_qty.value) || 1)), maxq = Math.max(minq, Math.floor(Number(f.max_qty.value) || minq));
      const salePrice = f.sale_price.value === "" ? null : Number(f.sale_price.value);
      const saleStart = f.sale_starts_at.value ? new Date(f.sale_starts_at.value).toISOString() : null;
      const saleEnd = f.sale_ends_at.value ? new Date(f.sale_ends_at.value).toISOString() : null;
      if (salePrice != null && salePrice >= Number(f.price.value)) return toast("Sale price must be lower than the normal price.", "error");
      if (saleStart && saleEnd && saleEnd <= saleStart) return toast("Sale end must be after the start.", "error");
      busy($('button.btn:not([type="button"])', f), async () => {
        let image_url = p.image_url || null;
        if (f.file.files[0]) image_url = await uploadImage(f.file.files[0], "products");
        const row = { name: f.pname.value.trim(), price: Number(f.price.value), sort: Number(f.sort.value) || 0,
          description: f.description.value.trim(), active: f.active.checked, image_url, fields, min_qty: minq, max_qty: maxq,
          out_of_stock: f.oos.checked, daily_limit: f.daily_limit.value === "" ? null : Math.max(0, Math.floor(Number(f.daily_limit.value))),
          sale_price: salePrice, sale_starts_at: salePrice == null ? null : saleStart, sale_ends_at: salePrice == null ? null : saleEnd };
        const { error } = p.id ? await sb.from("products").update(row).eq("id", p.id) : await sb.from("products").insert(row);
        if (error) throw error;
        closeModal(); toast("Product saved.", "success"); route();
      });
    };
  });
}

/* ---------------- 💬 HELP CHAT ---------------- */
async function help(v) {
  const id = Number(hashArg());
  if (id) return helpThreadAdmin(v, id);
  if (!AD.hF) AD.hF = "waiting";
  let q = sb.from("tickets").select("*, profiles(full_name, member_id)").order("updated_at", { ascending: false }).limit(200);
  if (AD.hF === "waiting") q = q.eq("status", "open").eq("waiting_for", "admin");
  else if (AD.hF === "open") q = q.eq("status", "open");
  else if (AD.hF === "closed") q = q.eq("status", "closed");
  const { data, error } = await q;
  if (error) throw error;
  v.innerHTML = `<p class="muted small">Customers' questions from the app. Reply here — they get a notification. Mark a chat solved when it's done.</p>
    ${chips([["waiting", "Waiting for me"], ["open", "All open"], ["closed", "Solved"], ["all", "All"]], AD.hF, "hf")}
    ${table(["#", "Customer", "Topic", "Status", "Last update", ""], data.map((t) => `<tr>
      <td>${t.id}</td><td>${who(t.profiles)}</td><td><b>${esc(t.subject)}</b>${t.order_id ? `<div class="small muted">Order #${t.order_id}</div>` : ""}</td>
      <td>${t.status === "closed" ? `<span class="badge completed">solved</span>` : t.waiting_for === "admin" ? `<span class="badge pending">needs reply</span>` : `<span class="badge agent">replied</span>`}</td>
      <td class="small">${fmtDate(t.updated_at)}</td><td><a class="btn sm" href="#help/${t.id}">Open</a></td></tr>`), "No chats here 🎉")}`;
  $$("[data-hf]", v).forEach((c) => (c.onclick = () => { AD.hF = c.dataset.hf; route(); }));
}
async function helpThreadAdmin(v, id) {
  const [{ data: t, error }, { data: msgs }] = await Promise.all([
    sb.from("tickets").select("*, profiles(id, full_name, member_id, balance, phone), orders(id, product_name, quantity, total, status, created_at, form_data)").eq("id", id).single(),
    sb.from("ticket_messages").select("*").eq("ticket_id", id).order("created_at")]);
  if (error) throw error;
  v.innerHTML = `<a class="back-link" href="#help">← All chats</a>
    <div class="grid-2 mk-two">
      <div class="card"><div class="row between"><h2 style="margin:0">${esc(t.subject)} <span class="muted small">#${t.id}</span></h2>
          ${t.status === "open" ? `<button class="btn sm success" id="closeT">✅ Mark solved</button>` : `<span class="badge completed">solved</span>`}</div>
        <div class="chat admin-chat" id="chat"></div>
        <form id="rf" class="chat-input" style="position:static"><textarea name="m" rows="2" maxlength="1000" placeholder="Write a reply…" required></textarea>
          <button class="btn" aria-label="Send">${ICONS.send}</button></form>
        <div class="row mt" style="gap:6px;flex-wrap:wrap">${["Hi! We're checking this now 👍", "Your order has been delivered ✅", "Please send a screenshot of your payment.", "Sorry for the wait! It's done now."]
          .map((q) => `<button type="button" class="btn sm soft" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div></div>
      <div class="card"><h3 style="margin-top:0">Customer</h3>${who(t.profiles)}
        <div class="small mt">Balance: <b>${money(t.profiles?.balance || 0)}</b> · Phone: ${esc(t.profiles?.phone || "—")}</div>
        <a class="btn sm soft mt" href="#customers/${t.user_id}">Open customer</a>
        ${t.orders ? `<h3>Order #${t.orders.id}</h3><div><b>${esc(t.orders.product_name)}</b> × ${t.orders.quantity} · ${money(t.orders.total)}</div>
          <div class="mt"><span class="badge ${t.orders.status}">${t.orders.status}</span> <span class="small muted">${fmtDate(t.orders.created_at)}</span></div>
          <div class="mt">${formView(t.orders.form_data)}</div><a class="btn sm soft mt" href="#orders">Go to orders</a>` : ""}</div></div>`;
  const chat = $("#chat"), seen = new Set();
  const add = (m) => {
    if (seen.has(m.id)) return; seen.add(m.id);
    chat.insertAdjacentHTML("beforeend", `<div class="bubble ${m.from_staff ? "me" : "them"}">${m.from_staff ? "" : `<div class="who">${esc(t.profiles?.full_name || "Customer")}</div>`}<div>${esc(m.body)}</div><div class="t">${fmtDate(m.created_at)}</div></div>`);
    chat.scrollTop = chat.scrollHeight;
  };
  (msgs || []).forEach(add);
  if (AD.helpCh) sb.removeChannel(AD.helpCh);
  AD.helpCh = sb.channel("adm-help-" + id).on("postgres_changes", { event: "INSERT", schema: "public", table: "ticket_messages", filter: `ticket_id=eq.${id}` }, (x) => add(x.new)).subscribe();
  const f = $("#rf");
  $$("[data-q]", v).forEach((b) => (b.onclick = () => { f.m.value = b.dataset.q; f.m.focus(); }));
  f.m.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) f.requestSubmit(); };
  f.onsubmit = (e) => {
    e.preventDefault();
    const body = f.m.value.trim(); if (!body) return;
    busy($("button", f), async () => {
      const { data: mid, error: er } = await sb.rpc("send_ticket_message", { p_ticket: id, p_body: body });
      if (er) throw er;
      f.m.value = ""; add({ id: mid, from_staff: true, body, created_at: new Date().toISOString() }); refreshCounts();
    });
  };
  if ($("#closeT")) $("#closeT").onclick = async () => {
    const { error: er } = await sb.rpc("close_ticket", { p_ticket: id });
    if (er) return toast(errMsg(er), "error");
    toast("Marked solved.", "success"); refreshCounts(); route();
  };
}

// SheetJS is loaded only when you download a report
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, bad) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => bad(new Error("Could not load the Excel tool. Check your internet."));
    document.head.appendChild(sc);
  });
}
// read every row (Supabase gives max 1000 per request)
async function fetchAll(make) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await make().range(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000 || out.length >= 100000) break;
  }
  return out;
}

async function promos(v) {
  const [{ data, error }, { data: uses }, { data: prods }] = await Promise.all([
    sb.from("promo_codes").select("*").order("created_at", { ascending: false }),
    sb.from("promo_uses").select("promo_id, discount, user_id"),
    sb.from("products").select("id, name, active").order("sort").order("name"),
  ]);
  if (error) throw error;
  const stat = (id) => { const u = (uses || []).filter((x) => x.promo_id === id); return { n: u.length, sum: u.reduce((a, x) => a + Number(x.discount), 0), people: new Set(u.map((x) => x.user_id)).size }; };
  const now = Date.now();
  const state = (c) => !c.active ? ["off", "cancelled"] : c.ends_at && new Date(c.ends_at) < now ? ["expired", "cancelled"]
    : c.starts_at && new Date(c.starts_at) > now ? ["scheduled", "pending"] : c.max_uses && stat(c.id).n >= c.max_uses ? ["used up", "rejected"] : ["live", "active"];
  const pname = (id) => (prods || []).find((x) => x.id === id)?.name || "deleted product";
  const off = (c) => c.kind === "percent" ? `${Number(c.value)}% off${c.max_discount ? ` (max ${money(c.max_discount)})` : ""}` : `${money(c.value)} off`;
  const totalSaved = (uses || []).reduce((a, x) => a + Number(x.discount), 0);

      <div class="stat"><div class="k">Live now</div><div class="v">${data.filter((c) => state(c)[0] === "live").length}</div></div>
      <div class="stat"><div class="k">Times used</div><div class="v">${(uses || []).length}</div></div>
      <div class="stat"><div class="k">Total discount given</div><div class="v">${money(totalSaved)}</div></div></div>
    <div class="toolbar mt"><span class="grow"></span><button class="btn" id="addPromo">${ICONS.plus} New promo code</button></div>
    ${table(["Code", "Discount", "Rules", "Used", "Discount given", "Status", ""], data.map((c) => { const st = stat(c.id), [lbl, cls] = state(c); return `<tr>
      <td><b class="mono" style="font-size:1.05rem">${esc(c.code)}</b>${c.note ? `<div class="small muted">${esc(c.note)}</div>` : ""}</td>
      <td><b>${off(c)}</b></td>
      <td class="small">${[c.min_order ? "Min order " + money(c.min_order) : "",
        c.product_ids?.length ? "Only: " + c.product_ids.map((id) => esc(pname(id))).join(", ") : "All products",
        (c.per_user === 1 ? "Once per customer" : c.per_user + "× per customer"),
        c.starts_at ? "From " + fmtDate(c.starts_at) : "", c.ends_at ? "Until " + fmtDate(c.ends_at) : ""].filter(Boolean).join("<br>")}</td>
      <td><b>${st.n}</b>${c.max_uses ? ` / ${c.max_uses}` : ""}<div class="small muted">${st.people} customer${st.people === 1 ? "" : "s"}</div></td>
      <td>${money(st.sum)}</td>
      <td><span class="badge ${cls}">${lbl}</span></td>
      <td style="white-space:nowrap"><button class="btn sm soft" data-pedit="${c.id}">Edit</button>
        <button class="btn sm ${c.active ? "ghost" : "success"}" data-ptog="${c.id}">${c.active ? "Turn off" : "Turn on"}</button>
        ${st.n ? "" : `<button class="btn sm ghost" data-pdel="${c.id}">Delete</button>`}</td></tr>`; }), "No promo codes yet — create your first one")}`;
  $("#addPromo").onclick = () => promoForm({}, prods || []);
  $$("[data-pedit]", v).forEach((b) => (b.onclick = () => promoForm(data.find((c) => c.id == b.dataset.pedit), prods || [])));
  $$("[data-ptog]", v).forEach((b) => (b.onclick = async () => {
    const c = data.find((x) => x.id == b.dataset.ptog);
    const { error: e } = await sb.from("promo_codes").update({ active: !c.active }).eq("id", c.id);
    if (e) return toast(errMsg(e), "error");
    toast(c.active ? `${c.code} turned off.` : `${c.code} is live.`, "success"); route();
  }));
  $$("[data-pdel]", v).forEach((b) => (b.onclick = async () => {
    if (!(await confirmBox("Delete promo code?", "It was never used, so it can be deleted.", "Delete", true))) return;

    if (e) return toast(errMsg(e), "error");
    toast("Deleted.", "success"); route();
  }));

// datetime-local <-> ISO (Nepal time on the admin's device)

    <div class="seg"><label><input type="radio" name="kind" value="percent" ${c.kind !== "fixed" ? "checked" : ""}> Percent (%)</label>

    <div class="grid-2"><div><label id="valLbl">Discount</label><input type="number" name="value" required min="0.01" step="0.01" value="${c.value ?? ""}"></div>
      <div id="maxBox"><label>Max discount (${CFG.CURRENCY}) <span class="muted">optional</span></label><input type="number" name="max_discount" min="1" step="0.01" value="${c.max_discount ?? ""}"></div></div>
    <div class="grid-2"><div><label>Minimum order (${CFG.CURRENCY}) <span class="muted">optional</span></label><input type="number" name="min_order" min="0" step="0.01" value="${c.min_order ?? ""}"></div>
      <div><label>Total uses <span class="muted">(empty = unlimited)</span></label><input type="number" name="max_uses" min="1" step="1" value="${c.max_uses ?? ""}"></div></div>
    <label>Uses per customer</label><input type="number" name="per_user" min="1" step="1" required value="${c.per_user ?? 1}">
    <div class="grid-2"><div><label>Starts <span class="muted">optional</span></label><input type="datetime-local" name="starts_at" value="${toLocalInput(c.starts_at)}"></div>
      <div><label>Ends <span class="muted">optional</span></label><input type="datetime-local" name="ends_at" value="${toLocalInput(c.ends_at)}"></div></div>
    <label>Works on</label>
    <div class="seg"><label><input type="radio" name="scope" value="all" ${chosen.size ? "" : "checked"}> All products</label>
      <label><input type="radio" name="scope" value="some" ${chosen.size ? "checked" : ""}> Only chosen products</label></div>
    <div id="prodPick" class="${chosen.size ? "" : "hidden"}"><div class="ag-list">${prods.map((p) => `<label class="ag-row"><input type="checkbox" value="${p.id}" ${chosen.has(p.id) ? "checked" : ""}>
      <span class="grow">${esc(p.name)}</span>${p.active ? "" : `<span class="small muted">hidden</span>`}</label>`).join("") || `<p class="small muted">No products yet.</p>`}</div></div>
    <label>Note for you <span class="muted">(optional, customers don't see it)</span></label><input name="note" maxlength="120" value="${esc(c.note || "")}" placeholder="e.g. Dashain Facebook campaign">
    <div class="setting-row"><b>Active</b><label class="switch" style="margin:0"><input type="checkbox" name="active" ${c.active !== false ? "checked" : ""}><span></span></label></div>
    <div class="pm-info mt" id="prev"></div>
    <button class="btn block mt" id="saveP">Save promo code</button></form>`, (m) => {
    const f = $("#prf", m);
    const paint = () => {
      const pct = f.kind.value === "percent";
      $("#valLbl", m).textContent = pct ? "Discount (%)" : `Discount (${CFG.CURRENCY})`;
      f.value.max = pct ? 100 : "";
      $("#maxBox", m).classList.toggle("hidden", !pct);
      $("#prodPick", m).classList.toggle("hidden", f.scope.value !== "some");
      const v = Number(f.value.value) || 0, code = f.code.value.trim().toUpperCase() || "CODE";
      $("#prev", m).innerHTML = `Customers type <b class="mono">${esc(code)}</b> → ${pct ? `${v}% off` : `${money(v)} off`}${pct && f.max_discount.value ? ` (max ${money(f.max_discount.value)})` : ""}${f.min_order.value ? ` on orders over ${money(f.min_order.value)}` : ""}.`;
    };
    f.oninput = paint; f.onchange = paint; paint();
    $("#genCode", m).onclick = () => { const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; f.code.value = "PV" + Array.from({ length: 6 }, () => a[Math.floor(Math.random() * a.length)]).join(""); paint(); };
    f.onsubmit = (e) => {
      e.preventDefault();
      const code = f.code.value.trim().toUpperCase();

      const kind = f.kind.value, value = Number(f.value.value);
      if (!(value > 0)) return toast("Enter the discount.", "error");
      if (kind === "percent" && value > 100) return toast("Percent can't be more than 100.", "error");
      const num = (el) => (el.value === "" ? null : Number(el.value));
      const starts = f.starts_at.value ? new Date(f.starts_at.value).toISOString() : null, ends = f.ends_at.value ? new Date(f.ends_at.value).toISOString() : null;
      if (starts && ends && ends <= starts) return toast("End must be after start.", "error");
      let product_ids = null;
      if (f.scope.value === "some") {
        product_ids = $$("#prodPick input:checked", m).map((x) => Number(x.value));

      }
      const row = { code, kind, value, max_discount: kind === "percent" ? num(f.max_discount) : null, min_order: num(f.min_order),
        max_uses: num(f.max_uses), per_user: Math.max(1, Math.floor(Number(f.per_user.value) || 1)), starts_at: starts, ends_at: ends,
        product_ids, note: f.note.value.trim() || null, active: f.active.checked };
      busy($("#saveP", m), async () => {
        const { error } = c.id ? await sb.from("promo_codes").update(row).eq("id", c.id) : await sb.from("promo_codes").insert(row);
        if (error) throw /duplicate|unique/i.test(error.message) ? new Error(`The code ${code} already exists.`) : error;
        closeModal(); toast(`Promo code ${code} saved.`, "success"); route();
      });
    };
  });
}

/* ---------- shared: sorting + balance summary for people lists ---------- */
const PEOPLE_SORTS = [["new", "Newest first"], ["high", "Highest balance"], ["low", "Lowest balance"], ["name", "Name A–Z"]];
function sortQuery(q, how) {
  if (how === "high") return q.order("balance", { ascending: false });
  if (how === "low") return q.order("balance", { ascending: true });
  if (how === "name") return q.order("full_name", { ascending: true });
  return q.order("created_at", { ascending: false });
}
function sortSelect(cur) {
  return `<select name="sort" style="width:auto">${PEOPLE_SORTS.map(([k, l]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}
function balanceSummary(list, label) {
  const total = list.reduce((a, u) => a + Number(u.balance), 0);
  const withMoney = list.filter((u) => Number(u.balance) > 0).length;
  return `<div class="stats mb">
    <div class="stat"><div class="k">${label}</div><div class="v">${list.length}</div></div>
    <div class="stat"><div class="k">Total balance</div><div class="v" style="color:var(--gold)">${money(total)}</div></div>
    <div class="stat"><div class="k">With money / zero</div><div class="v">${withMoney} / ${list.length - withMoney}</div></div></div>`;
}

}

    reload();
  };
}

/* ---------------- KYC ---------------- */
async function kyc(v) {
  let q = sb.from("kyc").select("*, profiles(full_name, member_id, email, phone, country)").order("submitted_at", { ascending: false }).limit(300);
  if (AD.kycFilter !== "all") q = q.eq("status", AD.kycFilter);
  const { data, error } = await q;
  if (error) throw error;
  v.innerHTML = chips([["pending", "Pending"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "All"]], AD.kycFilter, "kf") +
    table(["Member", "Name on document", "Document", "Region / City", "Submitted", "Status", ""], data.map((k) => `<tr>
      <td>${who(k.profiles)}<div class="small muted">${esc(k.profiles?.phone || "")}</div></td><td><b>${esc(k.full_name)}</b></td>
      <td>${esc(k.doc_type)}<div class="mono small">${esc(k.doc_number)}</div></td><td>${esc(k.region)}, ${esc(k.city)}</td>
      <td class="small">${fmtDate(k.submitted_at)}</td>
      <td><span class="badge ${k.status}">${k.status}</span>${k.note ? `<div class="small muted">${esc(k.note)}</div>` : ""}</td>
      <td style="white-space:nowrap">${k.photo_path ? `<button class="btn sm soft" data-photo="${esc(k.photo_path)}">📄 Photo</button>` : k.photo_required ? `<span class="small muted">photo asked</span> ` : ""}
        ${k.status === "pending" ? `<button class="btn sm success" data-ok="${k.user_id}">Approve</button><button class="btn sm ghost" data-no="${k.user_id}">Reject</button>` : ""}</td>
    </tr>`), "No KYC submissions");
  $$("[data-kf]", v).forEach((c) => (c.onclick = () => { AD.kycFilter = c.dataset.kf; route(); }));
  $$("[data-photo]", v).forEach((b) => (b.onclick = async () => {
    const { data: u, error } = await sb.storage.from("kyc").createSignedUrl(b.dataset.photo, 600);
    if (error) return toast(errMsg(error), "error");
    openModal(`<h2>Document photo</h2><img src="${esc(u.signedUrl)}" alt="Document" style="width:100%;border-radius:12px;background:#000">
      <p class="small muted mt">This private link works for 10 minutes. <a href="${esc(u.signedUrl)}" target="_blank" rel="noopener">Open full size</a></p>`);
  }));
  $$("[data-ok]", v).forEach((b) => (b.onclick = async () => {
    const { error } = await sb.rpc("admin_review_kyc", { p_user: b.dataset.ok, p_approve: true, p_note: null });
    if (error) return toast(errMsg(error), "error");
    toast("KYC approved.", "success"); refreshCounts(); route();
  }));
  $$("[data-no]", v).forEach((b) => (b.onclick = () => openModal(`<h2>Reject KYC</h2><form id="rf">
    <label>Reason (shown to customer)</label><input name="note" required maxlength="200" placeholder="e.g. Document number doesn't match">
    <label class="row" style="color:var(--text)"><input type="checkbox" name="photo" checked style="width:auto">
      Ask the customer to upload a photo of the document</label>
    <button class="btn danger block mt">Reject</button></form>`, (m) => {
    $("#rf", m).onsubmit = (e) => {
      e.preventDefault();
      busy($("button", e.target), async () => {
        const { error } = await sb.rpc("admin_review_kyc", { p_user: b.dataset.no, p_approve: false, p_note: e.target.note.value.trim(), p_require_photo: e.target.photo.checked });
        if (error) throw error;
        closeModal(); toast("KYC rejected.", "success"); refreshCounts(); route();
      });
    };
  })));
}

/* ---------------- TRANSACTIONS ---------------- */
async function transactions(v) {
  if (!AD.txRange) AD.txRange = defaultRange(30);
  const [from, to] = rangeISO(AD.txRange);
  let q = sb.from("transactions").select("*, profiles(id, full_name, member_id, role)")
    .gte("created_at", from).lt("created_at", to).order("created_at", { ascending: false }).limit(2000);
  if (AD.txType !== "all") q = q.eq("type", AD.txType);
  const { data, error } = await q;
  if (error) throw error;
  const types = [["all", "All"], ["load", "Agent deposits"], ["adjust", "Admin deposit/withdraw"], ["purchase", "Purchases"], ["withdraw", "Withdrawals"], ["refund", "Refunds"], ["agent_load", "Agent loads"], ["agent_payout", "Agent payouts"], ["agent_deposit", "Agent balance deposits"], ["bonus", "Referral bonuses"], ["voucher", "Gift vouchers"], ["commission", "Agent commission"]];
  const inSum = data.filter((t) => t.amount > 0).reduce((a, t) => a + Number(t.amount), 0);
  const outSum = data.filter((t) => t.amount < 0).reduce((a, t) => a - Number(t.amount), 0);
  v.innerHTML = rangeBar(AD.txRange) + chips(types, AD.txType, "tt") +
    `<div class="stats mb">
      <div class="stat"><div class="k">Transactions · ${fmtDay(AD.txRange.from)} – ${fmtDay(AD.txRange.to)}</div><div class="v">${data.length}${data.length >= 2000 ? "+" : ""}</div></div>
      <div class="stat"><div class="k">Money in (+)</div><div class="v" style="color:var(--green)">${money(inSum)}</div></div>
      <div class="stat"><div class="k">Money out (−)</div><div class="v" style="color:var(--red)">${money(outSum)}</div></div></div>` +
    table(["Date", "User", "Type", "Amount", "Balance after", "Details"], data.map((t) => `<tr>
      <td class="small">${fmtDate(t.created_at)}</td>
      <td><a href="#${t.profiles?.role === "customer" ? "customers" : "agents"}/${t.user_id}">${who(t.profiles)}</a></td>
      <td><span class="badge">${esc(TX_LABEL[t.type] || t.type)}</span></td>
      <td>${amt(Number(t.amount))}</td><td>${money(t.balance_after)}</td><td class="small">${esc(t.description || "")}</td></tr>`), "No transactions in these dates");
  $$("[data-tt]", v).forEach((c) => (c.onclick = () => { AD.txType = c.dataset.tt; route(); }));
  bindRange(v, AD.txRange, (nr) => { AD.txRange = nr; route(); });
}

function mountFieldBuilder(box, fields, emptyText) {
  const draw = () => {
    box.innerHTML = fields.length ? fields.map((fd, i) => `<div class="field-row" data-i="${i}">
      <div class="row"><input class="grow" data-k="label" value="${esc(fd.label)}" placeholder="Field name, e.g. eSewa ID" required>
        <select data-k="type" style="width:auto">${FIELD_TYPES.map(([k, l]) => `<option value="${k}" ${fd.type === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="row mt">
        ${fd.type === "select" ? `<input class="grow" data-k="options" value="${esc((fd.options || []).join(", "))}" placeholder="Options, separated by commas">`
          : `<input class="grow" data-k="placeholder" value="${esc(fd.placeholder || "")}" placeholder="Hint shown inside the box (optional)">`}
        <label class="row small" style="margin:0;white-space:nowrap;color:var(--text)"><input type="checkbox" data-k="required" ${fd.required ? "checked" : ""} style="width:auto"> Required</label>
      </div>
      <div class="row mt" style="justify-content:flex-end">
        <button type="button" class="btn sm soft" data-mv="-1" ${i === 0 ? "disabled" : ""}>↑</button>
        <button type="button" class="btn sm soft" data-mv="1" ${i === fields.length - 1 ? "disabled" : ""}>↓</button>
        <button type="button" class="btn sm danger" data-rm>Remove</button></div>
    </div>`).join("") : `<p class="small muted">${emptyText}</p>`;
  };
  const sync = () => $$(".field-row", box).forEach((row) => {
    const fd = fields[row.dataset.i];
    fd.label = $('[data-k="label"]', row).value.trim();
    fd.type = $('[data-k="type"]', row).value;
    fd.required = $('[data-k="required"]', row).checked;
    const o = $('[data-k="options"]', row), ph = $('[data-k="placeholder"]', row);
    if (o) fd.options = o.value.split(",").map((x) => x.trim()).filter(Boolean);
    if (ph) fd.placeholder = ph.value.trim();
  });
  box.onchange = (e) => { if (e.target.dataset.k === "type") { sync(); draw(); } };
  box.onclick = (e) => {
    const row = e.target.closest(".field-row"); if (!row) return;
    const i = Number(row.dataset.i);
    if (e.target.dataset.mv) { sync(); const j = i + Number(e.target.dataset.mv); [fields[i], fields[j]] = [fields[j], fields[i]]; draw(); }
    if (e.target.hasAttribute("data-rm")) { sync(); fields.splice(i, 1); draw(); }
  };
  draw();
  return {
    add: () => { sync(); fields.push({ id: newFieldId(), label: "", type: "text", required: true }); draw(); $$('[data-k="label"]', box).pop()?.focus(); },
    collect: () => {
      sync();
      for (const fd of fields) {
        if (!fd.label) throw new Error("Every form field needs a name.");
        if (fd.type === "select" && !(fd.options || []).length) throw new Error(`Add options for "${fd.label}".`);
        if (fd.type !== "select") delete fd.options;
      }
      return fields;
    },
  };
}

async function payouts(v) {
  if (!AD.payFilter) AD.payFilter = "pending";
  let q = sb.from("payout_requests").select("*, profiles(full_name, member_id)").order("created_at", { ascending: false }).limit(300);
  if (AD.payFilter !== "all") q = q.eq("status", AD.payFilter);
  const { data, error } = await q;
  if (error) throw error;
  v.innerHTML = `<p class="muted small">The money is already taken from the customer's balance and held. Send it to the account shown, then click <b>Mark paid</b>. <b>Reject</b> returns the money to their balance. (PremvioCash withdrawals are on the “PremvioCash codes” page.)</p>` +
    chips([["pending", "Waiting"], ["paid", "Paid"], ["rejected", "Rejected"], ["all", "All"]], AD.payFilter, "pf") +
    table(["#", "Customer", "Method", "Amount", "Send to", "Requested", "Status", ""], data.map((w) => `<tr>
      <td>${w.id}</td><td>${who(w.profiles)}</td><td><b>${esc(w.method_name)}</b></td><td><b>${money(w.amount)}</b></td>
      <td>${formView(w.form_data)}</td><td class="small">${fmtDate(w.created_at)}</td>
      <td><span class="badge ${w.status === "paid" ? "completed" : w.status}">${w.status}</span>${w.admin_note ? `<div class="small muted">${esc(w.admin_note)}</div>` : ""}</td>
      <td style="white-space:nowrap">${w.status === "pending" ? `<button class="btn sm success" data-pok="${w.id}">Mark paid</button><button class="btn sm ghost" data-pno="${w.id}">Reject</button>` : ""}</td>
    </tr>`), "No withdrawal requests");
  $$("[data-pf]", v).forEach((c) => (c.onclick = () => { AD.payFilter = c.dataset.pf; route(); }));
  $$("[data-pok]", v).forEach((b) => (b.onclick = () => {
    const w = data.find((x) => x.id == b.dataset.pok);
    openModal(`<h2>Mark withdrawal #${w.id} paid</h2>
      <p>Did you send <b>${money(w.amount)}</b> via <b>${esc(w.method_name)}</b> to:</p>${formView(w.form_data)}
      <form id="pkf"><label>Note to customer (optional, e.g. transaction ID)</label><input name="note" maxlength="200">
      <button class="btn success block mt">Yes, mark paid</button></form>`, (m) => {
      $("#pkf", m).onsubmit = (e) => {
        e.preventDefault();
        busy($("button", e.target), async () => {
          const { error: er } = await sb.rpc("admin_review_payout", { p_id: w.id, p_paid: true, p_note: e.target.note.value.trim() || null });
          if (er) throw er;
          closeModal(); toast("Marked as paid.", "success"); refreshCounts(); route();
        });
      };
    });
  }));
  $$("[data-pno]", v).forEach((b) => (b.onclick = () => openModal(`<h2>Reject withdrawal #${b.dataset.pno}</h2>
    <p class="muted small">The money goes back to the customer's balance.</p><form id="pnf">
    <label>Reason (shown to customer)</label><input name="note" required maxlength="200" placeholder="e.g. Wrong account number">
    <button class="btn danger block mt">Reject &amp; refund</button></form>`, (m) => {
    $("#pnf", m).onsubmit = (e) => {
      e.preventDefault();
      busy($("button", e.target), async () => {
        const { error: er } = await sb.rpc("admin_review_payout", { p_id: Number(b.dataset.pno), p_paid: false, p_note: e.target.note.value.trim() });
        if (er) throw er;
        closeModal(); toast("Rejected and refunded.", "success"); refreshCounts(); route();
      });
    };
  })));
}

</script>
</body>
</html>
